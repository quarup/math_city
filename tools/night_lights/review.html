<!doctype html>
<meta charset="utf-8">
<title>Math City night lights</title>
<style>
  :root { --bg: #10161f; --panel: #18212d; --line: #2a3644; --ink: #e8eef4; --muted: #8fa1b3; --accent: #ffd27a; --on: #6fd08c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-columns: 270px 1fr; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  aside header { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  aside h1 { font-size: 16px; margin: 0 0 4px; }
  #progress { color: var(--muted); font-size: 12.5px; }
  aside label { display: flex; gap: 6px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 12.5px; }
  #list { overflow-y: auto; flex: 1; padding: 6px 0; }
  #list button { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 5px 14px; font: inherit; cursor: pointer; }
  #list button:hover { background: #202c3a; }
  #list button.current { background: #26364a; }
  #list .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  #list .ok { color: var(--on); width: 1em; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar h2 { font-size: 16px; margin: 0 8px 0 0; }
  .group { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .group button, .bar > button { background: #1f2a38; color: var(--ink); border: 0; padding: 6px 11px; font: inherit; cursor: pointer; }
  .bar > button { border: 1px solid var(--line); border-radius: 8px; }
  .group button + button { border-left: 1px solid var(--line); }
  .group button.active { background: var(--accent); color: #2a1f00; font-weight: 600; }
  .group button:disabled { opacity: .4; cursor: default; }
  .bar > button.primary { background: var(--on); color: #06220f; font-weight: 600; border-color: transparent; }
  .bar kbd { font: 11px ui-monospace, Menlo, monospace; opacity: .7; margin-left: 4px; }
  .bar .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  #stage { flex: 1; overflow: auto; display: grid; place-items: center; padding: 20px; }
  canvas { image-rendering: pixelated; cursor: crosshair; border-radius: 6px; }
  #help { padding: 8px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; background: var(--panel); }
  #help b { color: var(--ink); }
  input[type=range] { accent-color: var(--accent); }
</style>
<aside>
  <header>
    <h1>Night lights</h1>
    <div id="progress"></div>
    <label><input type="checkbox" id="hideDone"> Hide reviewed</label>
  </header>
  <div id="list"></div>
</aside>
<main>
  <div class="bar">
    <h2 id="title"></h2>
    <div class="group" id="tools">
      <button data-tool="box">Box<kbd>B</kbd></button>
      <button data-tool="draw">Draw<kbd>P</kbd></button>
      <button data-tool="wand">Wand<kbd>W</kbd></button>
      <button data-tool="lamp">Lamp<kbd>L</kbd></button>
      <button data-tool="edit">Edit<kbd>E</kbd></button>
    </div>
    <div class="group" id="kinds" title="In Edit: the kind of the selected regions (click to change it). Otherwise: the kind of the next region you draw">
      <button data-kind="w" title="Lit warm; keeps a room's hours, dark from midnight to 5:30">Window</button>
      <button data-kind="g" title="Lit warm like a window, but on all night">Glow</button>
      <button data-kind="s" title="Keeps the art's own colour (a cross, a neon, a screen, a tank); on all night">Sign</button>
    </div>
    <div class="group" id="slopes" title="Which way the box's top edge runs">
      <button data-slope="0.5">╲</button>
      <button data-slope="-0.5">╱</button>
      <button data-slope="0">▭</button>
    </div>
    <label>Wand <input type="range" id="tol" min="6" max="48" value="18"></label>
    <div class="group">
      <button id="day">Day / night<kbd>D</kbd></button>
      <button id="outlines">Outlines<kbd>O</kbd></button>
      <button id="zoom">Zoom<kbd>Z</kbd></button>
    </div>
    <div class="group">
      <button id="undo">Undo<kbd>⌘Z</kbd></button>
      <button id="clear" title="Remove every region on this sprite">Clear</button>
    </div>
    <span class="spacer"></span>
    <span id="status"></span>
    <button id="prev">←</button>
    <button id="next">→</button>
    <button class="primary" id="done">Reviewed, next<kbd>R</kbd></button>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="help"></div>
</main>
<script>
'use strict';
const MAX_VERTICES = 6;
const HELP = {
  box: '<b>Box</b>: drag from one corner of a window to the opposite one. Pick the slope of its top edge first (╲ ╱ ▭).',
  draw: '<b>Draw</b>: click each corner of the shape (3 to 6). Click the first corner again, double-click or press <b>Enter</b> to finish; <b>Esc</b> cancels.',
  wand: '<b>Wand</b>: click inside a window; it grows to the patch of similar colour and becomes a polygon. Raise the tolerance if it stops short, lower it if it leaks.',
  lamp: '<b>Lamp</b>: click a porch lamp, a garden light, any point of light. It shines as a bright core in a round halo, from dusk until dawn. <b>[ ]</b> makes it smaller or bigger.',
  edit: '<b>Edit</b>: click a region to select it; <b>Shift-click</b> adds or removes one; <b>drag a box</b> to select everything inside (Shift adds to the selection); <b>⌘A</b> selects all. One selected: drag a corner, double-click an edge to add a corner (up to 6), Alt-click a corner to remove it. Any selection: drag inside to move, <b>⌘D</b> duplicates, <b>Delete</b> removes, <b>G</b> or the Window / Glow / Sign buttons change the kind, <b>[ ]</b> shrink / grow, <b>Esc</b> deselects.',
};
const $ = (id) => document.getElementById(id);
const S = { sprites: {}, names: [], cur: null, tool: 'box', kind: 'w', slope: 0.5, night: true, outlines: true, zoom: 0, hover: null, sels: [], drag: null, draft: null, mouse: null, tint: [80, 95, 160], undo: [] };
const ZOOMS = [0, 2, 3, 4, 6];
const LAMP_RADIUS = 2.5;
// The one selected region, when exactly one is: corner editing needs that.
const one = () => (S.sels.length === 1 ? S.sels[0] : null);
const canvas = $('c'), ctx = canvas.getContext('2d');
let spriteImg = null, litImg = null, tinted = null, litVersion = 0;

function loadImage(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
const cur = () => S.sprites[S.cur];
function zoomFor(sp) { if (S.zoom) return S.zoom; const [w, h] = sp.size; const stage = $('stage'); const fit = Math.min((stage.clientWidth - 40) / w, (stage.clientHeight - 40) / h); return Math.max(1, Math.min(6, Math.floor(fit * 2) / 2)); }

async function open(name) {
  S.cur = name; S.hover = null; S.sels = []; S.drag = null; S.draft = null; S.undo = [];
  const sp = cur();
  spriteImg = await loadImage(`/sprites/${name}.png`);
  await reloadLit();
  // The sprite under the app's night tint: multiply, then cut back to its alpha.
  tinted = document.createElement('canvas'); tinted.width = sp.size[0]; tinted.height = sp.size[1];
  const t = tinted.getContext('2d'); t.drawImage(spriteImg, 0, 0);
  t.globalCompositeOperation = 'multiply'; t.fillStyle = `rgb(${S.tint})`; t.fillRect(0, 0, tinted.width, tinted.height);
  t.globalCompositeOperation = 'destination-in'; t.drawImage(spriteImg, 0, 0);
  history.replaceState(null, '', '#' + name);
  renderList(); render();
  document.querySelector('#list .current')?.scrollIntoView({ block: 'nearest' });
}
async function reloadLit() { litImg = await loadImage(`/api/lit/${S.cur}.png?v=${++litVersion}`); }

function pathOf(c, regions, z) {
  c.beginPath();
  for (const r of regions) { const p = r.p; c.moveTo(p[0] * z, p[1] * z); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i] * z, p[i + 1] * z); c.closePath(); }
}
// Canvas pixels per CSS pixel, so handles keep one size on screen.
const cssScale = () => { const rect = canvas.getBoundingClientRect(); return rect.width ? canvas.width / rect.width : 1; };
function render() {
  const sp = cur(); if (!sp || !spriteImg) return;
  const z = zoomFor(sp), [w, h] = sp.size, u = cssScale();
  canvas.width = w * z; canvas.height = h * z;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = S.night ? '#121826' : '#5b7a52'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const on = sp.regions;
  if (S.night) {
    ctx.drawImage(tinted, 0, 0, w * z, h * z);
    const shapes = on.filter((r) => r.k !== 'l');
    if (shapes.length && litImg) {
      const layer = document.createElement('canvas'); layer.width = w; layer.height = h;
      const l = layer.getContext('2d'); pathOf(l, shapes, 1); l.clip(); l.drawImage(litImg, 0, 0);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55; ctx.filter = `blur(${3 * z}px)`; ctx.drawImage(layer, 0, 0, w * z, h * z); ctx.restore();
      ctx.drawImage(layer, 0, 0, w * z, h * z);
    }
    // Point lamps: a core in a round halo, as the app draws them.
    for (const r of on) if (r.k === 'l') { const [cx, cy, rad] = lampOf(r); const g = ctx.createRadialGradient(cx * z, cy * z, 0, cx * z, cy * z, rad * 4.5 * z); g.addColorStop(0, 'rgba(255,214,150,.95)'); g.addColorStop(0.35, 'rgba(255,214,150,.33)'); g.addColorStop(1, 'rgba(255,214,150,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx * z, cy * z, rad * 4.5 * z, 0, 7); ctx.fill(); ctx.fillStyle = '#fffcec'; ctx.beginPath(); ctx.arc(cx * z, cy * z, rad * 0.6 * z, 0, 7); ctx.fill(); }
  } else {
    ctx.drawImage(spriteImg, 0, 0, w * z, h * z);
    ctx.strokeStyle = 'rgba(255,210,90,.95)'; ctx.lineWidth = 1.5 * u; pathOf(ctx, on, z); ctx.stroke();
  }
  if (S.outlines) {
    ctx.lineWidth = u; ctx.strokeStyle = 'rgba(120,200,255,.9)'; pathOf(ctx, on.filter((r) => r.k === 'g'), z); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,130,210,.95)'; pathOf(ctx, on.filter((r) => r.k === 's'), z); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,214,150,.9)'; pathOf(ctx, on.filter((r) => r.k === 'l'), z); ctx.stroke();
  }
  if (S.hover && !S.sels.includes(S.hover)) { ctx.lineWidth = 1.5 * u; ctx.strokeStyle = 'rgba(255,255,255,.75)'; pathOf(ctx, [S.hover], z); ctx.stroke(); }
  if (S.sels.length) { ctx.lineWidth = 2 * u; ctx.strokeStyle = '#fff'; pathOf(ctx, S.sels, z); ctx.stroke(); }
  if (S.drag?.kind === 'marquee') { const d = S.drag; ctx.lineWidth = u; ctx.strokeStyle = '#fff'; ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.setLineDash([4 * u, 3 * u]); ctx.beginPath(); ctx.rect(Math.min(d.x0, d.x1) * z, Math.min(d.y0, d.y1) * z, Math.abs(d.x1 - d.x0) * z, Math.abs(d.y1 - d.y0) * z); ctx.fill(); ctx.stroke(); ctx.setLineDash([]); }
  if (one() && one().k !== 'l') {
    const p = one().p;
    for (let i = 0; i < p.length; i += 2) { ctx.beginPath(); ctx.arc(p[i] * z, p[i + 1] * z, 5 * u, 0, 7); ctx.fillStyle = S.drag?.kind === 'vertex' && S.drag.index === i ? '#ffd27a' : '#fff'; ctx.fill(); ctx.lineWidth = 1.5 * u; ctx.strokeStyle = '#10161f'; ctx.stroke(); }
  }
  if (S.drag?.kind === 'box') { ctx.lineWidth = 1.5 * u; ctx.strokeStyle = '#fff'; ctx.setLineDash([4 * u, 3 * u]); pathOf(ctx, [{ p: boxPolygon(S.drag) }], z); ctx.stroke(); ctx.setLineDash([]); }
  if (S.draft) {
    const pts = S.draft.concat(S.mouse && S.draft.length < MAX_VERTICES ? S.mouse : []);
    ctx.lineWidth = 1.5 * u; ctx.strokeStyle = '#fff'; ctx.setLineDash([4 * u, 3 * u]); ctx.beginPath(); ctx.moveTo(pts[0] * z, pts[1] * z); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i] * z, pts[i + 1] * z); if (S.draft.length >= 6) ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
    for (let i = 0; i < S.draft.length; i += 2) { ctx.beginPath(); ctx.arc(S.draft[i] * z, S.draft[i + 1] * z, (i === 0 ? 6 : 4) * u, 0, 7); ctx.fillStyle = i === 0 ? '#6fd08c' : '#fff'; ctx.fill(); }
  }
  $('title').textContent = S.cur;
  setActive('kinds', 'kind', shownKind());
  const KIND = { w: 'window', g: 'glow', s: 'sign', l: 'lamp' };
  const sel = one() ? ` · selected: ${KIND[one().k]}${one().k === 'l' ? '' : ', ' + one().p.length / 2 + ' corners'}` : S.sels.length ? ` · ${S.sels.length} selected` : '';
  $('status').textContent = `${on.length} ${on.length === 1 ? 'region' : 'regions'}${sel}`;
  $('undo').disabled = !S.undo.length;
}
function renderList() {
  const hide = $('hideDone').checked;
  const done = S.names.filter((n) => S.sprites[n].reviewed).length;
  $('progress').textContent = `${done} of ${S.names.length} reviewed`;
  $('list').innerHTML = '';
  for (const n of S.names) {
    const sp = S.sprites[n]; if (hide && sp.reviewed && n !== S.cur) continue;
    const b = document.createElement('button'); if (n === S.cur) b.className = 'current';
    b.innerHTML = `<span>${n}</span><span class="n">${sp.regions.length || ''}</span><span class="ok">${sp.reviewed ? '✓' : ''}</span>`;
    b.onclick = () => open(n); $('list').appendChild(b);
  }
}

// ---- geometry ----
function inside(p, x, y) { let hit = false; for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) { const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) hit = !hit; } return hit; }
function areaOf(p) { let a = 0; for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) a += (p[j] + p[i]) * (p[j + 1] - p[i + 1]); return Math.abs(a / 2); }
function regionAt(x, y) { let best = null, bestArea = Infinity; for (const r of cur().regions) if (inside(r.p, x, y)) { const a = areaOf(r.p); if (a < bestArea) { best = r; bestArea = a; } } return best; }
function pos(e) { const rect = canvas.getBoundingClientRect(), z = zoomFor(cur()); return [(e.clientX - rect.left) * (canvas.width / rect.width) / z, (e.clientY - rect.top) * (canvas.height / rect.height) / z]; }
// Sprite pixels per CSS pixel: how far a 6 px click tolerance reaches.
const reach = (px) => px * cssScale() / zoomFor(cur());
function vertexAt(r, x, y) { const lim = reach(8); for (let i = 0; i < r.p.length; i += 2) if (Math.hypot(r.p[i] - x, r.p[i + 1] - y) <= lim) return i; return -1; }
function edgeAt(r, x, y) { // nearest edge within reach: [insert index, point on it]
  let best = null, bestD = reach(6); const p = r.p;
  for (let i = 0; i < p.length; i += 2) { const j = (i + 2) % p.length; const ax = p[i], ay = p[i + 1], bx = p[j], by = p[j + 1]; const len2 = (bx - ax) ** 2 + (by - ay) ** 2 || 1; const t = Math.max(0, Math.min(1, ((x - ax) * (bx - ax) + (y - ay) * (by - ay)) / len2)); const qx = ax + t * (bx - ax), qy = ay + t * (by - ay); const d = Math.hypot(x - qx, y - qy); if (d < bestD) { bestD = d; best = [i + 2, qx, qy]; } }
  return best;
}
const snap = (v) => Math.round(v * 2) / 2;
function boxPolygon(d) { const s = S.slope, dx = d.x1 - d.x0, top1 = d.y0 + s * dx, hh = d.y1 - top1; return [d.x0, d.y0, d.x1, top1, d.x1, top1 + hh, d.x0, d.y0 + hh].map(snap); }
function centreOf(p) { let x = 0, y = 0; for (let i = 0; i < p.length; i += 2) { x += p[i]; y += p[i + 1]; } const n = p.length / 2; return [x / n, y / n]; }
// A lamp's centre and core radius, from the bounds of its little hexagon (as the app reads it).
function lampOf(r) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (let i = 0; i < r.p.length; i += 2) { x0 = Math.min(x0, r.p[i]); x1 = Math.max(x1, r.p[i]); y0 = Math.min(y0, r.p[i + 1]); y1 = Math.max(y1, r.p[i + 1]); } return [(x0 + x1) / 2, (y0 + y1) / 2, (x1 - x0 + y1 - y0) / 4]; }
function hexagon(x, y, rad) { const p = []; for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; p.push(Math.round((x + rad * Math.cos(a)) * 10) / 10, Math.round((y + rad * Math.sin(a)) * 10) / 10); } return p; }
// An id for a new region, from where it is: stable enough to read in a diff, unique on the sprite.
function freshId(p) { const [x, y] = centreOf(p); let id = `a${Math.round(x)}_${Math.round(y)}`; while (cur().regions.some((r) => r.id === id)) id += 'x'; return id; }

// ---- changes, undo, save ----
function pushUndo() { S.undo.push(JSON.stringify(cur().regions)); if (S.undo.length > 60) S.undo.shift(); }
async function undo() { if (!S.undo.length) return; const ids = new Set(S.sels.map((r) => r.id)); cur().regions = JSON.parse(S.undo.pop()); S.sels = cur().regions.filter((r) => ids.has(r.id)); S.hover = null; S.draft = null; await save(true); renderList(); render(); }
let saveTimer = null;
function save(needLit) {
  const sp = cur(), name = S.cur;
  const body = { regions: sp.regions.map((r) => ({ id: r.id, k: r.k, p: r.p })), reviewed: sp.reviewed };
  clearTimeout(saveTimer);
  const send = async () => { await fetch(`/api/save/${name}`, { method: 'POST', body: JSON.stringify(body) }); if (needLit && name === S.cur) { await reloadLit(); render(); } };
  if (needLit) return send();
  saveTimer = setTimeout(send, 250);
}
async function addRegion(p, kind = S.kind) {
  // A sliver (a box dragged along its own slope has no height) could never be seen or selected again.
  if (!p || p.length < 6 || areaOf(p) < 4) return;
  pushUndo();
  const r = { id: freshId(p), k: kind, p }; cur().regions.push(r); S.sels = [r];
  await save(true); renderList();
}
async function removeSelected() {
  if (!S.sels.length) return; pushUndo();
  cur().regions = cur().regions.filter((r) => !S.sels.includes(r));
  S.sels = []; S.hover = null; await save(true); renderList(); render();
}
// Copies the selection a little down and to the right, and selects the copies: drag them into place.
async function duplicateSelected() {
  if (!S.sels.length) return; pushUndo();
  const copies = [];
  for (const r of S.sels) { const p = r.p.map((v) => v + 6); const c = { id: freshId(p), k: r.k, p }; cur().regions.push(c); copies.push(c); }
  S.sels = copies; await save(true); renderList(); render();
}
async function scaleSelected(f) {
  if (!S.sels.length) return; pushUndo();
  for (const r of S.sels) { const [cx, cy] = centreOf(r.p); r.p = r.p.map((v, i) => Math.round(((i % 2 ? cy : cx) + (v - (i % 2 ? cy : cx)) * f) * 10) / 10); }
  await save(true); render();
}
async function finishDraft() { const d = S.draft; S.draft = null; if (d && d.length >= 6) await addRegion(d.map(snap)); render(); }

// ---- mouse ----
canvas.addEventListener('mousemove', (e) => {
  const [x, y] = pos(e); S.mouse = [x, y];
  const d = S.drag;
  if (d?.kind === 'box') { d.x1 = x; d.y1 = y; render(); return; }
  if (d?.kind === 'marquee') { d.x1 = x; d.y1 = y; render(); return; }
  if (d?.kind === 'vertex') { one().p[d.index] = snap(x); one().p[d.index + 1] = snap(y); d.moved = true; render(); return; }
  if (d?.kind === 'move') { const dx = snap(x - d.x), dy = snap(y - d.y); if (dx || dy) { for (const r of S.sels) for (let i = 0; i < r.p.length; i += 2) { r.p[i] += dx; r.p[i + 1] += dy; } d.x += dx; d.y += dy; d.moved = true; render(); } return; }
  if (S.draft) { render(); return; }
  const h = S.tool === 'edit' ? regionAt(x, y) : null; if (h !== S.hover) { S.hover = h; render(); }
});
canvas.addEventListener('mouseleave', () => { S.mouse = null; if (S.hover) { S.hover = null; render(); } });
canvas.addEventListener('mousedown', (e) => {
  const [x, y] = pos(e);
  if (S.tool === 'box') { S.drag = { kind: 'box', x0: x, y0: y, x1: x, y1: y }; return; }
  if (S.tool !== 'edit') return;
  const single = one();
  if (single && single.k !== 'l' && !e.shiftKey) {
    const v = vertexAt(single, x, y);
    if (v >= 0) {
      if (e.altKey) { if (single.p.length > 6) { pushUndo(); single.p.splice(v, 2); save(true); render(); } return; }
      pushUndo(); S.drag = { kind: 'vertex', index: v, moved: false }; render(); return;
    }
  }
  // What is under the pointer: a selected region first (they may overlap others), and an edge of the
  // single selection counts — the first click of the double-click that adds a corner lands there.
  const hit = S.sels.find((r) => inside(r.p, x, y)) || (single && edgeAt(single, x, y) ? single : null) || regionAt(x, y);
  if (hit && S.sels.includes(hit) && !e.shiftKey) { pushUndo(); S.drag = { kind: 'move', x, y, moved: false }; return; }
  // Anything else may become a selection box, even when it starts on a region (windows sit close
  // together); released without a drag it is a plain click on `pick`.
  S.drag = { kind: 'marquee', x0: x, y0: y, x1: x, y1: y, add: e.shiftKey, pick: hit };
});
window.addEventListener('mouseup', async () => {
  const d = S.drag; if (!d) return; S.drag = null;
  if (d.kind === 'box') { if (Math.abs(d.x1 - d.x0) >= 3 && Math.abs(d.y1 - d.y0) >= 3) await addRegion(boxPolygon(d)); render(); return; }
  if (d.kind === 'marquee') {
    const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1), y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1);
    if (x1 - x0 < reach(4) && y1 - y0 < reach(4)) { // a plain click: select, or with Shift add / remove
      const i = S.sels.indexOf(d.pick);
      if (!d.add) S.sels = d.pick ? [d.pick] : []; else if (i >= 0) S.sels.splice(i, 1); else if (d.pick) S.sels.push(d.pick);
      S.hover = null; render(); return;
    }
    const caught = cur().regions.filter((r) => { const [cx, cy] = centreOf(r.p); return cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1; });
    S.sels = d.add ? [...new Set([...S.sels, ...caught])] : caught; render(); return;
  }
  if (!d.moved) { S.undo.pop(); render(); return; }
  await save(true); render();
});
canvas.addEventListener('dblclick', async (e) => {
  const [x, y] = pos(e);
  if (S.tool === 'draw') { await finishDraft(); return; }
  const r = one();
  if (S.tool !== 'edit' || !r || r.k === 'l' || r.p.length >= MAX_VERTICES * 2) return;
  const hit = edgeAt(r, x, y); if (!hit) return;
  pushUndo(); r.p.splice(hit[0], 0, snap(hit[1]), snap(hit[2]));
  await save(true); render();
});
canvas.addEventListener('click', async (e) => {
  const [x, y] = pos(e);
  if (S.tool === 'wand') {
    const res = await fetch(`/api/wand/${S.cur}`, { method: 'POST', body: JSON.stringify({ x: Math.floor(x), y: Math.floor(y), tol: +$('tol').value }) });
    const { p } = await res.json(); if (!p) { $('status').textContent = 'wand: nothing there (try a higher tolerance)'; return; }
    await addRegion(p); render();
  } else if (S.tool === 'lamp') {
    await addRegion(hexagon(x, y, LAMP_RADIUS), 'l'); render();
  } else if (S.tool === 'draw') {
    if (e.detail > 1) return; // the second click of a double-click finishes instead
    if (!S.draft) { S.draft = [x, y]; S.sels = []; render(); return; }
    if (S.draft.length >= 6 && Math.hypot(S.draft[0] - x, S.draft[1] - y) <= reach(9)) { await finishDraft(); return; }
    S.draft.push(x, y); if (S.draft.length >= MAX_VERTICES * 2) { await finishDraft(); return; }
    render();
  }
});

// ---- toolbar and keys ----
function setActive(groupId, attr, value) { for (const b of $(groupId).children) b.classList.toggle('active', b.dataset[attr] === String(value)); }
function setTool(t) { S.tool = t; S.hover = null; S.draft = null; S.drag = null; if (t !== 'edit') S.sels = []; setActive('tools', 'tool', t); $('help').innerHTML = HELP[t] + ' Everything saves as you go.'; render(); }
function setToolKeepingSelection(t) { const sels = S.sels; setTool(t); S.sels = sels; render(); }
$('tools').onclick = (e) => { const t = e.target.closest('button')?.dataset.tool; if (t) setTool(t); };
// Window / Glow / Sign: in Edit with a selection, the buttons show its kind (none when it is mixed or
// all lamps) and change it. Otherwise they are the kind of the next region drawn, so picking Glow for
// the next sign does not turn the window just drawn into one.
const editingSelection = () => S.tool === 'edit' && S.sels.length > 0;
const NEXT_KIND = { w: 'g', g: 's', s: 'w' }; // what G steps a selection through
function shownKind() { if (!editingSelection()) return S.kind; const rs = S.sels.filter((r) => r.k !== 'l'); return rs.length && rs.every((r) => r.k === rs[0].k) ? rs[0].k : null; }
async function changeKind(k) {
  const rs = S.sels.filter((r) => r.k !== 'l' && r.k !== k); if (!rs.length) return;
  pushUndo(); for (const r of rs) r.k = k; await save(true); render();
}
$('kinds').onclick = (e) => { const k = e.target.closest('button')?.dataset.kind; if (!k) return; if (editingSelection()) changeKind(k); else { S.kind = k; render(); } };
$('slopes').onclick = (e) => { const s = e.target.closest('button')?.dataset.slope; if (s !== undefined) { S.slope = +s; setActive('slopes', 'slope', s); } };
function step(d) { const list = S.names; const i = list.indexOf(S.cur); open(list[(i + d + list.length) % list.length]); }
async function clearAll() { if (!cur().regions.length) return; pushUndo(); cur().regions = []; S.sels = []; S.hover = null; await save(true); renderList(); render(); }
$('day').onclick = () => { S.night = !S.night; render(); };
$('outlines').onclick = () => { S.outlines = !S.outlines; render(); };
$('zoom').onclick = () => { S.zoom = ZOOMS[(ZOOMS.indexOf(S.zoom) + 1) % ZOOMS.length]; render(); };
$('undo').onclick = undo;
$('clear').onclick = clearAll;
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('done').onclick = async () => { cur().reviewed = true; await save(true); const i = S.names.indexOf(S.cur); const next = S.names.slice(i + 1).concat(S.names.slice(0, i)).find((n) => !S.sprites[n].reviewed); if (next) open(next); else { renderList(); render(); } };
$('hideDone').onchange = renderList;
window.addEventListener('keydown', async (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); undo(); return; }
  if ((e.metaKey || e.ctrlKey) && k === 'a') { e.preventDefault(); setTool('edit'); S.sels = [...cur().regions]; render(); return; }
  if ((e.metaKey || e.ctrlKey) && k === 'd') { e.preventDefault(); if (S.sels.length) { await duplicateSelected(); setToolKeepingSelection('edit'); } return; }
  if (e.metaKey || e.ctrlKey) return;
  if (k === 'escape') { if (S.draft) S.draft = null; else S.sels = []; render(); }
  else if (k === 'enter' && S.draft) await finishDraft();
  else if ((k === 'delete' || k === 'backspace') && S.sels.length) await removeSelected();
  else if (k === 'g' && S.sels.length) await changeKind(NEXT_KIND[S.sels.find((r) => r.k !== 'l')?.k] || 'w');
  else if (k === '[' && S.sels.length) await scaleSelected(1 / 1.15);
  else if (k === ']' && S.sels.length) await scaleSelected(1.15);
  else if (k === 'arrowright') step(1); else if (k === 'arrowleft') step(-1);
  else if (k === 'e') setTool('edit'); else if (k === 'p') setTool('draw'); else if (k === 'b') setTool('box'); else if (k === 'w') setTool('wand'); else if (k === 'l') setTool('lamp');
  else if (k === 'd') $('day').click(); else if (k === 'o') $('outlines').click(); else if (k === 'z') $('zoom').click();
  else if (k === 'r') $('done').click();
  else return;
  e.preventDefault();
});
window.addEventListener('resize', render);

(async () => {
  const state = await (await fetch('/api/state')).json();
  S.sprites = state.sprites; S.names = Object.keys(state.sprites); S.tint = state.tint;
  setActive('slopes', 'slope', S.slope);
  const wanted = decodeURIComponent(location.hash.slice(1));
  await open(S.names.includes(wanted) ? wanted : S.names.find((n) => !S.sprites[n].reviewed) || S.names[0]);
  setTool(S.tool);
})();
</script>
